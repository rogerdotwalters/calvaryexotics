<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Calvary Exotics — Free Tub Card</title>
<style>
  @font-face { font-family:'Cinzel'; font-weight:700; src:url('../fonts/cinzel-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family:'Cinzel'; font-weight:900; src:url('../fonts/cinzel-latin-900-normal.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:600; src:url('../fonts/inter-latin-600-normal.woff2') format('woff2'); }
  @page { size: 5.5in 8.5in; margin: 0; }
  :root { --green:#1F4F2A; --deep:#14301b; --gold:#A07C2E; --gold-lt:#e6c76a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#fff; }
  body { font-family:'Inter',sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .sheet { width:5.5in; height:8.5in; margin:0 auto; background:#fff; padding:.5in .5in .45in; position:relative;
           display:flex; flex-direction:column; align-items:center; text-align:center; overflow:hidden; }
  .sheet::before { content:""; position:absolute; inset:.28in; border:1.5px solid var(--gold); border-radius:.1in; }
  .logo { width:2.9in; }
  .eyebrow { margin-top:.16in; font-size:9.5pt; letter-spacing:.3em; text-transform:uppercase; font-weight:600; color:var(--gold); }
  .burst { margin-top:.12in; width:100%; background:#fff; border:4px solid var(--green); border-radius:.14in; padding:.2in .1in .22in; color:var(--green); position:relative; }
  .burst::after { content:""; position:absolute; inset:.06in; border:1.5px dashed var(--gold); border-radius:.1in; }
  .free { font-family:'Cinzel',serif; font-weight:900; font-size:104pt; line-height:.9; color:var(--gold); letter-spacing:.02em; }
  .tub { font-family:'Cinzel',serif; font-weight:900; font-size:84pt; line-height:.95; letter-spacing:.06em; }
  .with { margin-top:.2in; font-family:'Cinzel',serif; font-weight:700; font-size:19pt; line-height:1.2; color:var(--green); }
  .with b { display:block; font-size:27pt; font-weight:900; color:var(--deep); letter-spacing:.04em; text-transform:uppercase; }
  .photos { margin-top:auto; display:grid; grid-template-columns:1fr 1fr; gap:.12in; width:100%; }
  .photos img { width:100%; height:2.5in; object-fit:cover; object-position:center; border-radius:.09in; display:block; border:1px solid rgba(31,79,42,.3); }
  .foot { margin-top:.14in; font-size:8.5pt; color:#46584A; letter-spacing:.04em; }
  .foot b { color:#1B2A1E; }
  @media print { html, body { background:none; } }
</style>
</head>
<body>
<main class="sheet">
  <img class="logo" src="../logo_gold.svg" alt="Calvary Exotics">
  <p class="eyebrow">Expo Special</p>
  <section class="burst">
    <div class="free">FREE</div>
    <div class="tub">TUB</div>
  </section>
  <p class="with">with purchase of a<b>crested gecko!</b></p>
  <div class="photos">
    <img src="../images/cards/tiger_1.webp" alt="Crested gecko">
    <img src="../images/cards/harley_1.webp" alt="Crested gecko">
  </div>
  <p class="foot">Ask us at the table &nbsp;&middot;&nbsp; <b>@calvary_exotics</b> &nbsp;&middot;&nbsp; <b>calvaryexotics.com</b></p>
</main>
</body>
</html>
