@font-face{font-family:Cinzel;font-weight:900;src:url(../fonts/cinzel-latin-900-normal.woff2)}

@font-face{font-family:Inter;font-weight:600;src:url(../fonts/inter-latin-600-normal.woff2)}

*{margin:0;box-sizing:border-box}
:root{--ember:#E8761E;--pumpkin:#F29A2E;--gold:#E3B94F;--cream:#FFF4E0;--deep:#0B2415;--rust:#B5441A}
body{width:1080px;height:1350px;background:var(--deep);font-family:Inter,sans-serif;color:var(--cream);position:relative;overflow:hidden}
.photo{position:absolute;left:0;top:0;width:1080px;height:810px;background:url(../images/tiger_1.jpg) 50% 45%/cover}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,36,21,.85) 0,rgba(11,36,21,0) 24%,rgba(11,36,21,0) 62%,var(--deep) 100%)}
.logo{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:560px;z-index:3;filter:drop-shadow(0 2px 6px rgba(0,0,0,.8))}
.leaves{position:absolute;left:0;top:0;z-index:2}
.leaf{position:absolute;z-index:2;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.panel{position:absolute;left:0;right:0;top:690px;bottom:0;text-align:center;z-index:3;padding:0 60px}
.tag{display:inline-block;background:var(--ember);color:#fff;font-weight:600;letter-spacing:.22em;font-size:22px;text-transform:uppercase;padding:10px 26px;border-radius:40px;box-shadow:0 4px 0 var(--rust)}
h1 small{display:block;font-size:56px;color:var(--cream);margin-bottom:10px;letter-spacing:.02em}
h1{font-family:Cinzel;font-weight:900;font-size:96px;white-space:nowrap;line-height:1.02;margin:30px 0 28px;color:var(--pumpkin);text-shadow:0 4px 0 #000a,0 0 24px #000a;letter-spacing:.01em}
h1 span{color:var(--cream)}
p.sub{font-family:Inter;font-weight:600;font-size:44px;line-height:1.25;white-space:nowrap;color:var(--cream)}
p.sub b{color:var(--gold)}
.cta{position:absolute;left:0;right:0;bottom:0;height:128px;background:linear-gradient(90deg,var(--ember),var(--pumpkin));display:flex;align-items:center;justify-content:space-between;padding:0 64px;color:#1b0f04;z-index:4}
.flogo{width:470px;height:38px;background:#0b2415;-webkit-mask:url(../logo_white.svg) center/contain no-repeat;mask:url(../logo_white.svg) center/contain no-repeat}
.cta b{font-family:Cinzel;font-weight:900;font-size:42px}
.cta span{font-weight:600;font-size:26px}
