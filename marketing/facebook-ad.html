<!doctype html>
<html><head><meta charset="utf-8"><title>Calvary Exotics Facebook Ad</title>
<style>
@font-face{font-family:Cinzel;font-weight:700;src:url(../fonts/cinzel-latin-700-normal.woff2)}
@font-face{font-family:Cinzel;font-weight:900;src:url(../fonts/cinzel-latin-900-normal.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(../fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(../fonts/inter-latin-600-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0f2e1a;font-family:Inter,sans-serif;color:#fae6cd;position:relative;overflow:hidden}
.hero{position:absolute;inset:0 0 auto 0;height:800px;background:url(../images/viper_main.JPG) center 35%/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,31,20,.55) 0%,rgba(7,31,20,0) 25%,rgba(15,46,26,0) 60%,#0f2e1a 100%)}
.logo{position:absolute;top:50px;left:50%;transform:translateX(-50%);height:auto;width:520px;z-index:2;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.content{position:absolute;left:70px;right:70px;top:690px;text-align:center}
.eyebrow{font-weight:600;letter-spacing:.28em;font-size:22px;color:#C9A84C;text-transform:uppercase}
h1{font-family:Cinzel;font-weight:900;font-size:84px;line-height:1.05;margin:16px 0 22px;text-shadow:0 3px 14px rgba(0,0,0,.5)}
h1 em{font-style:normal;color:#C9A84C}
p.sub{font-size:31px;line-height:1.4;color:#f4dcbc;max-width:880px;margin:0 auto}
.row{display:flex;gap:14px;margin:34px 0 0;justify-content:center}
.row div{width:200px;height:130px;border-radius:14px;border:3px solid #C9A84C;background-size:cover;background-position:center}
.foot{position:absolute;left:0;right:0;bottom:0;height:120px;background:#C9A84C;color:#0f2e1a;display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.foot b{font-family:Cinzel;font-size:38px;font-weight:900}
.foot span{font-weight:600;font-size:24px}
</style></head><body>
<div class="hero"></div>
<img class="logo" src="../logo_gold.svg" alt="Calvary Exotics">
<div class="content">
  <div class="eyebrow">Captive-bred · Tyler, TX</div>
  <h1>Meet Our <em>Beautiful</em> Geckos</h1>
  <p class="sub">Crested &amp; viper geckos, raised with care. We’re growing and can’t wait to bring a new generation into the hobby.</p>
  <div class="row">
    <div style="background-image:url(../images/tricolor_1.jpg)"></div>
    <div style="background-image:url(../images/whitewall_1.jpg)"></div>
    <div style="background-image:url(../images/hand_viper_geckos.jpg)"></div>
    <div style="background-image:url(../images/harley_1.jpg)"></div>
  </div>
</div>
<div class="foot"><b>calvaryexotics.com</b><span>Family-owned · Local delivery available</span></div>
</body></html>
