<body>
  <div id="app" class="drawer-closed">
    <main id="stage">
      <noscript>CE Vivarium needs JavaScript. <a href="../index.html">Back to Calvary Exotics</a></noscript>
      <canvas id="game" width="512" height="288" tabindex="0"
        aria-label="Your vivarium room. Drag to look around. Tap a table to select it, or tap plus to add a table."></canvas>
    </main>
    <div id="chrome">
      <header id="topbar">
        <div id="actionbar" aria-label="Care"></div>
        <div id="topright">
          <a id="siteLink" class="top-btn" href="../index.html" title="Back to Calvary Exotics">&larr; Site</a>
          <button id="viewToggle" class="top-btn" type="button" aria-pressed="false">View: Normal</button>
          <button id="opacityToggle" class="top-btn" type="button" aria-pressed="true" title="How solid the map is. Below 100% you can still move items." hidden>Opacity: 60%</button>
          <button id="editToggle" class="top-btn" type="button" aria-pressed="true" title="Turn off to stop moving or changing the objects in the tank">Edit: On</button>
          <button id="timeToggle" class="top-btn" type="button" aria-pressed="false" title="Switch the room between day and night">Time: Day</button>
          <button id="uiToggle" class="top-btn" type="button" aria-pressed="false">Hide UI</button>
        </div>
      </header>
      <div id="legend" aria-label="Data view legend" hidden></div>
      <aside id="drawer" aria-label="Items" hidden></aside>
      <div id="maptip" class="map-tip" role="status" hidden></div>
      <div id="ranges" role="region" aria-label="Recommended ranges" hidden></div>
      <div id="thermostat" role="dialog" aria-label="Room thermostat" hidden></div>
      <div id="editbar" role="dialog" aria-label="Edit selected item" hidden></div>
      <nav id="tabbar" aria-label="Categories"></nav>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
